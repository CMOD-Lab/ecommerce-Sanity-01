version: "3.8"

services:
  ecommerce-webapi:
    image: ecommerce-mcontmono:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-webapi
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - KESTREL_PORT=8080
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING:-localhost:6379}
      - REDIS_INSTANCE_NAME=${REDIS_INSTANCE_NAME:-EcommerceWebApi:}
      - SIGNALR_CORS_ORIGINS=${SIGNALR_CORS_ORIGINS:-http://localhost:3001}
      - ApplicationSettings__Secret=${APPLICATION_SECRET:-IHIdpkcABXxdUbq4TOSSECkJWP7yVvUc}
    volumes:
      - ./Logs:/app/Logs
      - ./database.json:/app/database.json
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "dotnet --info > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
