apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-mcontmono
  namespace: ecommerce-mcontmono
  labels:
    app: ecommerce-mcontmono
    version: "1.0"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-mcontmono
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecommerce-mcontmono
        version: "1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: ecommerce-mcontmono
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: KESTREL_PORT
              value: "8080"
            - name: REDIS_CONNECTION_STRING
              value: "{{REDIS_CONNECTION_STRING}}"
            - name: REDIS_INSTANCE_NAME
              value: "{{REDIS_INSTANCE_NAME}}"
            - name: SIGNALR_CORS_ORIGINS
              value: "{{SIGNALR_CORS_ORIGINS}}"
            - name: ApplicationSettings__Secret
              value: "{{APPLICATION_SECRET}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: logs-volume
              mountPath: /app/Logs
      volumes:
        - name: logs-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
